name: Build Interface Studio Windows
on:
  push:
    branches: [main]
    paths: ['app/package.json', '.github/workflows/windows.yml']
  workflow_dispatch:
concurrency:
  group: interface-studio-windows
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Interface-Studio-Windows
          path: app/dist/*.exe
          if-no-files-found: error
      - name: Publish Windows application
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "studio-${{ github.run_number }}" dist/*.exe --target "${{ github.sha }}" --title "Interface Studio 6.94" --notes "Actualisation du projet dans l’éditeur et sur le téléphone USB." --latest
